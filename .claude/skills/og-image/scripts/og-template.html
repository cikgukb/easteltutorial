<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<!-- Font: tukar ikut brand projek -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap">
<style>
  /* TOKEN BRAND — isi dari :root projek */
  :root { --g1: #38acf9; --g2: #6c6ee7; --g3: #993bdc; --glow: rgba(59,232,229,.55); --accent-text: #7c3aed; --font: "Hanken Grotesk", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: var(--font); color: #fff; position: relative;
    background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%); }
  .glow { position: absolute; right: -180px; top: -260px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 62%); }
  .glow2 { position: absolute; left: -200px; bottom: -300px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 60%); }
  .wrap { position: relative; height: 100%; padding: 56px 64px; display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center; }
  .mark img { width: 60px; height: 60px; }
  .brand b { font-size: 30px; font-weight: 800; display: block; } .brand span { font-size: 20px; opacity: .9; }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin-bottom: 20px; text-shadow: 0 4px 24px rgba(0,0,0,.15); }
  p { font-size: 26px; line-height: 1.35; opacity: .95; max-width: 700px; font-weight: 500; }
  .pills { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .pill { font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); }
  .side { display: grid; gap: 18px; justify-items: center; }
  .panel { background: #fff; color: #17123a; border-radius: 22px; padding: 16px; width: 100%; display: grid; justify-items: center; gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .panel img { width: 180px; height: 180px; }
  .panel small { color: #5e5a7a; font-size: 15px; font-weight: 700; letter-spacing: .08em; }
  .panel code { font-family: ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 800; color: var(--accent-text); letter-spacing: .06em; }
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="wrap">
    <div>
      <div class="brand"><div class="mark"><img src="LOGO.svg" alt=""></div><div><b>NAMA PROJEK</b><span>oleh NAMA ANDA</span></div></div>
      <h1>TAJUK UTAMA — janji laman, maksimum 2 baris.</h1>
      <p>Subtajuk satu ayat: apa yang pengguna dapat di dalam laman ini.</p>
      <div class="pills"><span class="pill">Fakta 1</span><span class="pill">Fakta 2</span><span class="pill">Fakta 3</span></div>
    </div>
    <div class="side">
      <!-- Elemen identiti: QR / avatar / produk. Padam jika tiada. -->
      <div class="panel"><img src="ELEMEN.svg" alt=""><small>LABEL</small><code>NILAI</code></div>
    </div>
  </div>
</body></html>
