<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Hanken Grotesk", system-ui, sans-serif; color: #fff;
    background: linear-gradient(135deg, #38acf9 0%, #6c6ee7 45%, #993bdc 100%); position: relative; }
  .glow { position: absolute; right: -180px; top: -260px; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,232,229,.55), transparent 62%); }
  .glow2 { position: absolute; left: -200px; bottom: -300px; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 60%); }
  .wrap { position: relative; height: 100%; padding: 56px 64px; display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center; }
  .mark img { width: 60px; height: 60px; }
  .brand b { font-size: 30px; font-weight: 800; letter-spacing: -.01em; display: block; }
  .brand span { font-size: 20px; opacity: .9; }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin-bottom: 20px; text-shadow: 0 4px 24px rgba(0,0,0,.15); }
  p { font-size: 26px; line-height: 1.35; opacity: .95; max-width: 700px; font-weight: 500; }
  .pills { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .pill { font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); }
  .side { display: grid; gap: 18px; justify-items: center; }
  .mentor { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); border-radius: 22px; padding: 14px 18px; width: 100%; }
  .mentor img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: #fff; }
  .mentor b { display: block; font-size: 22px; } .mentor span { font-size: 17px; opacity: .9; }
  .qr { background: #fff; border-radius: 22px; padding: 16px; width: 100%; display: grid; justify-items: center; gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .qr img { width: 180px; height: 180px; }
  .qr small { color: #5e5a7a; font-size: 15px; font-weight: 700; letter-spacing: .08em; }
  .qr code { font-family: ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 800; color: #7c3aed; letter-spacing: .06em; }
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="wrap">
    <div>
      <div class="brand"><div class="mark"><img src="../../public/assets/logo-eastel-white-100.png" alt=""></div><div><b>Panduan Eastel</b><span>oleh CikguKB</span></div></div>
      <h1>Daftar &amp; guna Eastel, langkah demi langkah.</h1>
      <p>Aktifkan SIM, kekalkan nombor lama (MNP), tambah nilai, beli pelan data &amp; Eastel Wallet. Video + tutorial bertulis.</p>
      <div class="pills"><span class="pill">12 bab</span><span class="pill">Video YouTube</span><span class="pill">Bahasa Melayu</span></div>
    </div>
    <div class="side">
      <div class="mentor"><img src="../../public/assets/avatar-cikgukb.svg" alt=""><div><b>CikguKB</b><span>Mentor &amp; upline anda</span></div></div>
      <div class="qr"><img src="../../public/assets/qr-upline.svg" alt=""><small>ID UPLINE</small><code>E-0222933</code></div>
    </div>
  </div>
</body></html>
